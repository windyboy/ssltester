# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
picocli = "4.7.7"
jackson = "2.18.4" # For both jackson-databind and jackson-dataformat-yaml
slf4j = "2.0.17"
logback = "1.5.18"
junitJupiter = "5.10.0"
mockito = "5.10.0"
kotlin = "2.1.21"
coroutines = "1.8.1"
kotlin-logging = "3.0.5"
mockk = "1.14.1"
bytebuddy = "1.14.14"

# Certificate validation libraries
bouncycastle = "1.77"
certificate-transparency = "1.0.0"
pkix = "1.0.0"
pkix-ocsp = "1.0.0"

[libraries]
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitJupiter" }

mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

# Certificate validation libraries
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
certificate-transparency = { module = "com.google.certificate-transparency:certificate-transparency", version.ref = "certificate-transparency" }
pkix-ocsp = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "pkix-ocsp" }
