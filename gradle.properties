# Gradle properties for the SSL Test project

# Force Gradle to use the JAVA_HOME JDK (defaults to Java 21 in CI)
# Use an environment variable rather than a hard-coded path to ensure
# the project builds on any machine, including CI and VS Code.
# If a specific JDK is required, set JAVA_HOME before running Gradle.

# JVM options for better performance
org.gradle.jvmargs=-Xmx2G -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# Enable Gradle build cache
org.gradle.caching=true

# Enable parallel execution
org.gradle.parallel=true

# Enable configuration cache
org.gradle.configuration-cache=true

# Kotlin compiler options
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

