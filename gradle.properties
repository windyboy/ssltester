# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# Gradle properties for the SSL Test project

# JVM options for better performance
org.gradle.jvmargs=-Xmx2G -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# Enable Gradle build cache
org.gradle.caching=true

# Enable parallel execution
org.gradle.parallel=true

# Enable configuration cache (disabled for dependency-check tasks)
org.gradle.configuration-cache=true

# Kotlin compiler options
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# OWASP Dependency Check Configuration
# Network timeout settings (in milliseconds)
systemProp.dependencycheck.connection.timeout=30000
systemProp.dependencycheck.read.timeout=60000

# Retry settings
systemProp.dependencycheck.retry.count=3
systemProp.dependencycheck.retry.delay=5000

# Data source settings
systemProp.dependencycheck.data.directory=build/dependency-check-data
systemProp.dependencycheck.quick.query.timestamp=3600

# Disable problematic analyzers for Kotlin projects
systemProp.dependencycheck.analyzer.nuspec.enabled=false
systemProp.dependencycheck.analyzer.nodeaudit.enabled=false
systemProp.dependencycheck.analyzer.nodepackage.enabled=false

# Skip on error to prevent build failures due to network issues
systemProp.dependencycheck.skipOnError=true

# User agent to avoid being blocked
systemProp.dependencycheck.user.agent=Mozilla/5.0 (compatible; OWASP-Dependency-Check/9.0.1)

