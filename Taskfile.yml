version: '3'

# ───────────────────────────────
# Global variables (string-substituted everywhere)
# ───────────────────────────────
vars:
  VERSION:        '{{ .VERSION | default "0.0.2" }}'
  PROJECT_NAME:   'ssl-test'
  HOST:           '{{ .HOST | default "example.com" }}'
  PORT:           '{{ .PORT | default "443" }}'
  TIMEOUT:        '{{ .TIMEOUT | default "5000" }}'
  FORMAT:         '{{ .FORMAT | default "TXT" }}'
  OUTPUT:         '{{ .OUTPUT | default "" }}'
  JAVA_VERSION:   '21'
  KOTLIN_VERSION: '2.1.21'
  GRADLEW:        './gradlew'

# ───────────────────────────────
# Environment variables exported into every cmd
# ───────────────────────────────
env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2G'

# ───────────────────────────────
# Tasks
# ───────────────────────────────
tasks:
  # --- Bootstrap / Setup ------------------------------------
  bootstrap:
    desc: Check required tools and environment
    cmds:
      - 'echo "🔧 Checking environment…"'
      - 'command -v java >/dev/null 2>&1 || { echo "❌ Java not found!"; exit 1; }'
      - '[ -x "{{.GRADLEW}}" ] || { echo "❌ Gradle wrapper missing or not executable"; exit 1; }'
      - 'echo "✅ Environment ready"'

  validate-version:
    desc: Validate version format (semver)
    internal: true
    silent: true
    cmds:
      - 'echo "{{.VERSION}}" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$" || { echo "❌ Invalid version format"; exit 1; }'
      - 'echo "✅ Version {{.VERSION}} is valid"'

  # --- Clean / Build ----------------------------------------
  clean:
    desc: Clean project build files
    deps: [bootstrap]
    cmds:
      - 'echo "🧹 Cleaning project…"'
      - '{{.GRADLEW}} clean'
      - 'echo "✅ Clean completed"'

  compile:
    desc: Compile the project
    deps: [validate-version]
    cmds:
      - 'echo "🔨 Compiling project…"'
      - '{{.GRADLEW}} compileKotlin'
      - 'echo "✅ Compilation completed"'

  build:
    desc: Build release artifacts
    deps: [validate-version, clean]
    cmds:
      - 'echo "🏗️  Building project…"'
      - '{{.GRADLEW}} build --continue'
      - 'echo "✅ Build completed"'

  build-fat-jar:
    desc: Build fat JAR with all dependencies
    deps: [validate-version, clean]
    cmds:
      - 'echo "📦 Building fat JAR…"'
      - '{{.GRADLEW}} shadowJar --continue'
      - 'echo "✅ Fat JAR created successfully"'

  # --- Lint / Format ----------------------------------------
  lint:
    desc: Run code linting with ktlint
    cmds:
      - 'echo "🔍 Running code linting…"'
      - '{{.GRADLEW}} ktlintCheck'
      - 'echo "✅ Linting passed"'

  format:
    desc: Format code with ktlint
    cmds:
      - 'echo "🎨 Formatting code…"'
      - '{{.GRADLEW}} ktlintFormat'
      - 'echo "✅ Code formatting completed"'

  # --- Testing ----------------------------------------------
  test-unit:
    desc: Run unit tests
    cmds:
      - 'echo "🧪 Running unit tests…"'
      - '{{.GRADLEW}} test --tests "org.example.*Test" --continue'
      - 'echo "✅ Unit tests completed"'

  test-integration:
    desc: Run integration tests
    cmds:
      - 'echo "🔗 Running integration tests…"'
      - |
        if find app/src/test \( -name "*IT.kt" -o -name "*IT.java" \) | grep -q .; then
          {{.GRADLEW}} test --tests "org.example.*IT" --continue
        else
          echo "ℹ️  No integration tests found (files ending with IT)"
        fi
      - 'echo "✅ Integration tests completed"'

  test-cli:
    desc: Test CLI functionality
    cmds:
      - 'echo "🧪 Testing CLI functionality…"'
      - '{{.GRADLEW}} run --args="--help" >/dev/null 2>&1 && echo "✅ Help command works"'
      - '{{.GRADLEW}} run --args="--version" >/dev/null 2>&1 && echo "✅ Version command works"'
      - |
        {{.GRADLEW}} run --args="invalid-host-that-does-not-exist.com --port 443 --connect-timeout 1000" >/dev/null 2>&1 \
          && echo "✅ Invalid host handled gracefully" || echo "✅ Invalid host properly rejected"
      - 'echo "✅ CLI tests completed"'

  test:
    desc: Run all tests
    deps: [test-unit, test-integration, test-cli]

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - 'echo "📊 Running tests with coverage…"'
      - '{{.GRADLEW}} jacocoTestReport --continue'
      - 'echo "✅ Coverage report generated at app/build/reports/jacoco/test/html/index.html"'

  # --- Run ----------------------------------------------
  run:
    desc: Run SSL test with specified parameters
    cmds:
      - 'echo "🚀 Running SSL test for {{.HOST}}:{{.PORT}} with {{.FORMAT}} format…"'
      - |
        {{.GRADLEW}} run --args="{{.HOST}} --port {{.PORT}} --connect-timeout {{.TIMEOUT}} --format {{.FORMAT}}{{if .OUTPUT}} --output {{.OUTPUT}}{{end}}" --continue

  # --- Quality Checks ----------------------------------------
  check:
    desc: Run all quality checks (lint, test, build)
    deps: [lint, test, build]

  # --- Dependency Management ----------------------------------------
  deps-check:
    desc: Check for outdated dependencies
    cmds:
      - 'echo "🔍 Checking for outdated dependencies…"'
      - '{{.GRADLEW}} dependencyUpdates'
      - 'echo "✅ Dependency check completed"'

  deps-update:
    desc: Update dependencies to latest versions
    cmds:
      - 'echo "🔄 Updating dependencies to latest versions…"'
      - '{{.GRADLEW}} dependencyUpdates'
      - 'echo "📋 Generated dependency update report at build/dependencyUpdates/report.txt"'
      - 'echo "💡 Review the report and update gradle/libs.versions.toml manually"'

  deps-update-interactive:
    desc: Interactive dependency update with prompts
    cmds:
      - 'echo "🔄 Interactive dependency update…"'
      - '{{.GRADLEW}} dependencyUpdates'
      - 'echo "📋 Dependency update report generated"'
      - |
        if [ -f build/dependencyUpdates/report.txt ]; then
          echo "📄 Current dependency status:"
          cat build/dependencyUpdates/report.txt
        fi
      - 'echo "💡 Please review the report and update gradle/libs.versions.toml manually"'

  deps-update-script:
    desc: Use the advanced dependency update script
    cmds:
      - 'echo "🔄 Running advanced dependency update script…"'
      - './scripts/update-dependencies.sh'

  deps-update-auto:
    desc: Automatic dependency update with script
    cmds:
      - 'echo "🔄 Running automatic dependency update…"'
      - './scripts/update-dependencies.sh update'

  deps-check-script:
    desc: Check dependencies using the script
    cmds:
      - 'echo "🔍 Checking dependencies with script…"'
      - './scripts/update-dependencies.sh check'

  # --- Help -----------------------------------------------
  default:
    desc: Show help and available tasks
    cmds:
      - 'echo "🔧 SSL Test Tool - Task Runner"'
      - 'task --list-all'
